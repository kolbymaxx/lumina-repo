name: Build Music27

on:
  workflow_dispatch:
  push:
    paths:
      - 'Music27/**'
      # Music27 compiles SPKit as shared source, so a change there is a change
      # to this tweak's binary.
      - 'SPKit/**'
      - '.github/workflows/build-music27.yml'

jobs:
  build:
    name: Build rootless .deb
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build Music27 (rootless)
        working-directory: Music27
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "Built packages:"
          ls -lah packages || ls -lah ../packages || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music27-rootless-deb
          path: out/*.deb
          if-no-files-found: error

  build-roothide:
    name: Build roothide .deb
    runs-on: macos-14
    timeout-minutes: 45
    # NON-BLOCKING ON PURPOSE, but not for the reason first written here.
    #
    # This was added after two 1.1.5x runs failed at `Setup Theos (roothide
    # fork)`, and the note claimed the flake was specific to the roothide fork.
    # It is not. On 1.1.53 the identical failure hit the **rootless** job:
    #
    #   Get "https://api.github.com/repos/theos/theos/commits/master":
    #   tls: failed to verify certificate: x509: certificate signed by unknown authority
    #
    # Same step, same one-second failure, different repository URL — it is
    # `waruhachi/theos-action`'s `cache-key` step reaching api.github.com, and
    # it can hit either job. Four occurrences in one afternoon. Re-running the
    # failed job has cleared it every time.
    #
    # So this flag is not flake insurance; if it were, it would need to be on
    # both jobs and that would defeat the point of having CI. It stays for the
    # support reason alone: the rootless package is verified on device every
    # version, and the roothide one cannot be — the maintainer no longer runs a
    # roothide jailbreak. The artifact is still produced whenever the toolchain
    # cooperates, so roothide users keep getting builds; it is just not allowed
    # to gate a package nobody can test. See Music27/README.md.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos (roothide fork)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build Music27 (roothide)
        working-directory: Music27
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          # roothide packages use the arm64e architecture tag
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          ls -lah packages || ls -lah ../packages || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"
          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -30
          if dpkg-deb -c "$DEB" | grep -q ' var/jb/'; then
            echo "ERROR: roothide deb still contains /var/jb paths" >&2
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music27-roothide-deb
          path: out/*.deb
          if-no-files-found: error
