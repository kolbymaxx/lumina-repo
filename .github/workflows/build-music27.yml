name: Build Music27

on:
  workflow_dispatch:
  push:
    paths:
      - 'Music27/**'
      # Music27 compiles SPKit as shared source, so a change there is a change
      # to this tweak's binary.
      - 'SPKit/**'
      - '.github/workflows/build-music27.yml'

jobs:
  build:
    name: Build rootless .deb
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build Music27 (rootless)
        working-directory: Music27
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "Built packages:"
          ls -lah packages || ls -lah ../packages || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music27-rootless-deb
          path: out/*.deb
          if-no-files-found: error

  build-roothide:
    name: Build roothide .deb
    runs-on: macos-14
    timeout-minutes: 45
    # NON-BLOCKING ON PURPOSE — this job's red X does not mean the tweak is
    # broken, and letting it mean that was costing real signal.
    #
    # Two 1.1.5x runs failed here, both at `Setup Theos (roothide fork)`, one
    # second in, before a single source file was compiled:
    #
    #   Get "https://api.github.com/repos/theos/sdks/commits/master":
    #   tls: failed to verify certificate: x509: certificate signed by unknown authority
    #
    # The rootless job built the identical sources cleanly seconds earlier both
    # times. One of those runs was a README-only commit. A failure mode that can
    # flag a docs change as a broken build is not a signal worth blocking on.
    #
    # The artifact is still produced whenever the step succeeds, so anyone on
    # roothide keeps getting builds — but the package is unverified: the
    # maintainer moved off roothide and cannot test it. See Music27/README.md.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos (roothide fork)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build Music27 (roothide)
        working-directory: Music27
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          # roothide packages use the arm64e architecture tag
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          ls -lah packages || ls -lah ../packages || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"
          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -30
          if dpkg-deb -c "$DEB" | grep -q ' var/jb/'; then
            echo "ERROR: roothide deb still contains /var/jb paths" >&2
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music27-roothide-deb
          path: out/*.deb
          if-no-files-found: error
