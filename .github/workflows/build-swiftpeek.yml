name: Build SwiftPeek

# Build-only: upload rootless + roothide artifacts. Do NOT publish to APT / Pages.
on:
  workflow_dispatch:
  push:
    paths:
      - 'SwiftPeek/**'
      - 'tools/swiftpeek/**'
      - 'scripts/check-swiftpeek-version.sh'
      - '.github/workflows/build-swiftpeek.yml'
  pull_request:
    paths:
      - 'SwiftPeek/**'
      - 'tools/swiftpeek/**'
      - 'scripts/check-swiftpeek-version.sh'
      - '.github/workflows/build-swiftpeek.yml'

concurrency:
  group: swiftpeek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The host-side reader is half the tool — it is what a consumer actually runs
  # against a dump, and until now nothing checked it on push. Ubuntu, no
  # toolchain, seconds: there is no reason for this not to gate every change.
  #
  # It also guards the one thing in this repo that cannot be re-derived from
  # source: the icon thresholds in tools/swiftpeek/icons.py are tuned against a
  # real 201-entry SpringBoard inventory, not synthetic data. Changing one and
  # finding out later is exactly what this job is here to prevent.
  host-tools:
    name: Host tools (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        working-directory: tools
        run: python3 -m unittest swiftpeek.test_icons swiftpeek.test_api swiftpeek.test_scaffold -v

      - name: CLI smoke test
        working-directory: tools
        run: |
          set -euo pipefail
          python3 -m swiftpeek --help > /dev/null
          for sub in annotate summary types strings windows fields find targets scaffold icons calibration tint-plan; do
            python3 -m swiftpeek "$sub" --help > /dev/null
          done
          echo "all subcommands parse"

  build:
    name: Build rootless .deb
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the toolchain so a version slip fails in seconds rather than
      # after a five-minute build — and before the flaky Theos setup step, so it
      # still reports when that is having a bad day.
      - name: Version strings agree
        run: ./scripts/check-swiftpeek-version.sh

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # RETRIED, BECAUSE THIS STEP IS THE ONLY THING THAT EVER FAILS HERE.
      #
      # Six failures on 2026-08-11, none of them in our code, all inside this
      # action's network setup and all cleared by a re-run:
      #
      #   TLS to api.github.com (cache-key)      x3
      #   submodule fetch vendor/nic, vendor/logos
      #   submodule fetch vendor/orion
      #
      # A retry action cannot wrap another action, so the first attempt is
      # allowed to fail and a second identical step runs only if it did. Two
      # attempts, no third-party dependency, and a genuine failure still fails
      # the build because the second attempt is not itself forgiven.
      - name: Setup Theos
        id: theos
        continue-on-error: true
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Setup Theos (retry)
        if: steps.theos.outcome == 'failure'
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build SwiftPeek (rootless)
        working-directory: SwiftPeek
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"
          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          FILTER="$(find "$TMP" -name 'SwiftPeek.plist' -path '*DynamicLibraries*' | head -1)"
          PREFS_SRC="$GITHUB_WORKSPACE/SwiftPeek/layout/Library/PreferenceLoader/Preferences/SwiftPeek.plist"
          test -n "$FILTER"
          plutil -p "$FILTER"
          # 0.6.0 filters on com.apple.UIKit, so the dylib loads into every
          # UIKit process and the filter no longer gates anything. That moves
          # the entire safety argument onto the runtime gate, so the runtime
          # gate is what gets asserted — and it is asserted harder than the
          # narrow filter ever was.
          grep -q 'com.apple.UIKit' <(plutil -p "$FILTER")
          SRC="$GITHUB_WORKSPACE/SwiftPeek/src/SPAttach.m"
          # The constructor's FIRST statement must be the process check. If
          # anything is allowed to run before it, a broad filter means that
          # something runs in every app on the device.
          python3 - "$SRC" <<'PY'
          import re, sys
          src = open(sys.argv[1]).read()
          body = src.split('__attribute__((constructor)) static void SPConstructor', 1)
          assert len(body) == 2, "SPConstructor not found"
          # First non-comment, non-blank statement after the autoreleasepool.
          after = body[1].split('@autoreleasepool', 1)[1]
          stmts = [l.strip() for l in after.splitlines()
                   if l.strip() and not l.strip().startswith(('//', '/*', '*', '{'))]
          assert stmts and stmts[0].startswith('if (!SPIsAllowedProcess())'), \
              "first statement of SPConstructor is %r, expected the process gate" % (stmts[:1],)
          print("ok  SPConstructor gates on SPIsAllowedProcess first")
          PY
          # 0.2.0 put SpringBoard into Safe Mode with a Swift-linked dylib. The
          # dylib stays ObjC-only (checked below on the built binary) and
          # SpringBoard keeps a pref that defaults off.
          grep -q 'targetSpringBoard' "$SRC" || {
            echo "ERROR: no targetSpringBoard gate" >&2; exit 1; }
          grep -q 'targetSpringBoard' <(plutil -p "$PREFS_SRC") || {
            echo "ERROR: targetSpringBoard is not exposed in the prefs bundle" >&2; exit 1; }
          # The custom-target path is the new way into an arbitrary process. It
          # must stay behind its own switch and must refuse anything that is not
          # an .app bundle — daemons are where a bad injection stops being a
          # force-quit and starts being a restore.
          grep -q 'SPPrefBool(@"targetCustom", NO)' "$SRC" || {
            echo "ERROR: custom targets are not gated by targetCustom" >&2; exit 1; }
          grep -q 'isEqualToString:@"app"' "$SRC" || {
            echo "ERROR: custom targets do not require an .app bundle" >&2; exit 1; }
          grep -q 'targetCustom' <(plutil -p "$PREFS_SRC") || {
            echo "ERROR: targetCustom is not exposed in the prefs bundle" >&2; exit 1; }
          # An ObjC-only dylib is load-bearing: Swift runtime + SpringBoard is
          # the exact 0.2.1 failure, and the Makefile already states the rule
          # for every process, not just SpringBoard. So this runs unconditionally
          # rather than only when SpringBoard is in the filter.
          #
          # Checked on the BUILT DYLIB, not on the source layout. The previous
          # version only looked when SwiftPeek/src/*.swift existed and then
          # grepped the Makefile — so Swift living anywhere else, or reaching
          # _FILES through a variable, sailed straight past it. A linked Swift
          # runtime is the thing that actually bricks SpringBoard, and otool
          # reports that directly.
          DYLIB="$(find "$TMP" -name 'SwiftPeek.dylib' | head -1)"
          test -n "$DYLIB"
          echo "Linkage for $DYLIB:"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -Eq 'libswiftCore|/usr/lib/swift/|@rpath/libswift'; then
            echo "ERROR: SwiftPeek.dylib links the Swift runtime — this is the 0.2.1 Safe Mode bug" >&2
            exit 1
          fi
          # Belt and braces: nothing in the build description may name a .swift
          # source, wherever that source happens to live.
          if grep -q '\.swift' "$GITHUB_WORKSPACE/SwiftPeek/Makefile"; then
            echo "ERROR: SwiftPeek/Makefile references a .swift source" >&2
            exit 1
          fi
          PREFS="$(find "$TMP" -path '*/PreferenceLoader/Preferences/SwiftPeek.plist' | head -1)"
          test -n "$PREFS"
          plutil -p "$PREFS"
          grep -q 'dumpFieldMeta' <(plutil -p "$PREFS")
          dpkg-deb -I "$DEB"
          EXPECT_VER="$(sed -n 's/^Version: //p' control | head -1)"
          test -n "$EXPECT_VER"
          dpkg-deb -I "$DEB" | grep -q "Version: ${EXPECT_VER}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPeek-rootless-deb
          path: out/*.deb
          if-no-files-found: error

  build-roothide:
    name: Build roothide .deb
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before the toolchain so a version slip fails in seconds rather than
      # after a five-minute build — and before the flaky Theos setup step, so it
      # still reports when that is having a bad day.
      - name: Version strings agree
        run: ./scripts/check-swiftpeek-version.sh

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # RETRIED, BECAUSE THIS STEP IS THE ONLY THING THAT EVER FAILS HERE.
      #
      # Six failures on 2026-08-11, none of them in our code, all inside this
      # action's network setup and all cleared by a re-run:
      #
      #   TLS to api.github.com (cache-key)      x3
      #   submodule fetch vendor/nic, vendor/logos
      #   submodule fetch vendor/orion
      #
      # A retry action cannot wrap another action, so the first attempt is
      # allowed to fail and a second identical step runs only if it did. Two
      # attempts, no third-party dependency, and a genuine failure still fails
      # the build because the second attempt is not itself forgiven.
      - name: Setup Theos (roothide fork)
        id: theos_rh
        continue-on-error: true
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Setup Theos (roothide fork) (retry)
        if: steps.theos_rh.outcome == 'failure'
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build SwiftPeek (roothide)
        working-directory: SwiftPeek
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"
          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          dpkg-deb -I "$DEB"
          EXPECT_VER="$(sed -n 's/^Version: //p' control | head -1)"
          test -n "$EXPECT_VER"
          dpkg-deb -I "$DEB" | grep -q "Version: ${EXPECT_VER}"
          if dpkg-deb -c "$DEB" | grep -q ' var/jb/'; then
            echo "ERROR: roothide deb still contains /var/jb paths" >&2
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPeek-roothide-deb
          path: out/*.deb
          if-no-files-found: error
